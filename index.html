<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AgerLog - Dry Aging Guide</title>
  <meta name="theme-color" content="#121417">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥩</text></svg>">
  <style>
    :root {
      --bg: #121417;
      --card: #1c2026;
      --card-border: #2d333b;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --primary: #c93b3b;
      --accent: #d29922;
      --success: #238636;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: 0 0 90px 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 15px;
    }
    header {
      background: rgba(18, 20, 23, 0.95);
      border-bottom: 1px solid var(--card-border);
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .header-title { font-weight: 700; font-size: 1.15rem; color: #fff; margin: 0; }
    .chamber-banner {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      margin: 12px 16px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-around;
      text-align: center;
      font-size: 0.8rem;
    }
    .chamber-val { font-weight: 700; font-size: 1rem; color: #58a6ff; margin-top: 2px; }
    main { padding: 0 16px; max-width: 600px; margin: 0 auto; }
    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 700;
      background: #238636;
      color: #fff;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
    .btn-secondary { background: #30363d; color: #fff; }
    .btn-weigh { background: #1f6feb; margin-top: 10px; }
    .stage-box {
      background: rgba(255, 255, 255, 0.04);
      border-left: 4px solid var(--accent);
      border-radius: 4px;
      padding: 10px 12px;
      margin: 12px 0;
      font-size: 0.85rem;
      line-height: 1.4;
    }
    .stat-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 12px 0;
      text-align: center;
    }
    .stat-item {
      background: #111418;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 8px 4px;
    }
    .stat-lbl { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; }
    .stat-num { font-size: 1.15rem; font-weight: 700; margin-top: 2px; }
    .bottom-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: rgba(18, 20, 23, 0.95);
      border-top: 1px solid var(--card-border);
      padding: 12px 16px;
      max-width: 600px;
      margin: 0 auto;
    }
    .modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
      width: 100%;
      max-width: 440px;
    }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 0.82rem; color: var(--text-muted); margin-bottom: 5px; }
    input, select {
      width: 100%;
      background: #111418;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 12px;
      color: #fff;
      font-size: 1rem;
    }
    .info-callout {
      background: rgba(210, 153, 34, 0.1);
      border: 1px solid rgba(210, 153, 34, 0.3);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 0.8rem;
      color: #e3b341;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <header>
    <h1 class="header-title">🥩 AgerLog</h1>
    <span class="badge">MA400 Online</span>
  </header>

  <div class="chamber-banner">
    <div>
      <div>TEMP</div>
      <div class="chamber-val">1.5°C - 2°C</div>
    </div>
    <div>
      <div>HUMIDITY</div>
      <div class="chamber-val">75% - 80%</div>
    </div>
    <div>
      <div>UVC LIGHT</div>
      <div class="chamber-val" style="color:#3fb950;">ON</div>
    </div>
  </div>

  <main id="batchContainer">
    <div id="emptyView" style="text-align:center; padding: 40px 16px; color: var(--text-muted);">
      <div style="font-size: 3rem; margin-bottom: 10px;">🥩</div>
      <h3 style="color:#fff; margin-bottom: 6px;">No Active Batches</h3>
      <p style="font-size: 0.85rem;">Tap the button below to add your first primal cut with stage-by-stage instructions.</p>
    </div>
  </main>

  <div class="bottom-bar">
    <button class="btn" onclick="openModal('addModal')">+ Start New Cut</button>
  </div>

  <!-- New Batch Modal -->
  <div class="modal" id="addModal">
    <div class="modal-content">
      <h3 style="margin-top:0; color:#fff;">Add Primal Cut</h3>
      
      <div class="form-group">
        <label>Select Cut Type</label>
        <select id="cutName" onchange="updateCutAdvice()">
          <option value="OP Rib / Standing Rib">OP Rib / Standing Rib (Bone-in)</option>
          <option value="Short Loin (T-Bone / Porterhouse)">Short Loin (T-Bone / Porterhouse)</option>
          <option value="Whole Striploin">Whole Striploin (Fat cap intact)</option>
          <option value="Custom Cut">Custom Cut</option>
        </select>
        <div id="cutAdvice" class="info-callout">
          Fat cap faces UP, bones face DOWN on rack. Do not wash with water.
        </div>
      </div>

      <div class="form-group">
        <label>Start Weight (grams)</label>
        <input type="number" id="startWeight" placeholder="e.g. 6500 (for 6.5 kg)" required>
      </div>

      <div class="form-group">
        <label>Start Date</label>
        <input type="date" id="startDate">
      </div>

      <div class="form-group">
        <label>Target Days</label>
        <input type="number" id="targetDays" value="35">
      </div>

      <div style="display:flex; gap:8px; margin-top:20px;">
        <button class="btn btn-secondary" onclick="closeModal('addModal')">Cancel</button>
        <button class="btn" onclick="createBatch()">Start Aging</button>
      </div>
    </div>
  </div>

  <!-- Weigh-In Modal -->
  <div class="modal" id="weighModal">
    <div class="modal-content">
      <h3 style="margin-top:0; color:#fff;">⚖️ Log Weigh-In</h3>
      <input type="hidden" id="weighBatchId">
      <div class="form-group">
        <label>Current Scale Reading (grams)</label>
        <input type="number" id="currentWeight" placeholder="e.g. 5800" required>
      </div>
      <div style="display:flex; gap:8px; margin-top:20px;">
        <button class="btn btn-secondary" onclick="closeModal('weighModal')">Cancel</button>
        <button class="btn" onclick="saveWeighIn()">Save Weight</button>
      </div>
    </div>
  </div>

  <script>
    let batches = JSON.parse(localStorage.getItem('agerBatches') || '[]');
    document.getElementById('startDate').value = new Date().toISOString().split('T')[0];

    function updateCutAdvice() {
      const val = document.getElementById('cutName').value;
      const box = document.getElementById('cutAdvice');
      if (val.includes('OP Rib')) {
        box.innerHTML = "🥩 <strong>Placement:</strong> Fat cap UP, bones DOWN[cite: 3]. Bones protect meat from drying too fast.";
      } else if (val.includes('Short Loin')) {
        box.innerHTML = "🥩 <strong>Placement:</strong> Central rack with bone resting flat. Leave 8cm air gap around sides[cite: 3].";
      } else if (val.includes('Striploin')) {
        box.innerHTML = "🥩 <strong>Placement:</strong> Keep fat cap intact and facing UP to shield the striploin eye[cite: 3, 4].";
      } else {
        box.innerHTML = "Ensure 8-10cm clearance on all sides for air circulation[cite: 3, 4].";
      }
    }

    function save() {
      localStorage.setItem('agerBatches', JSON.stringify(batches));
      render();
    }

    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    function createBatch() {
      const cut = document.getElementById('cutName').value;
      const startWeight = parseFloat(document.getElementById('startWeight').value);
      const startDate = document.getElementById('startDate').value;
      const targetDays = parseInt(document.getElementById('targetDays').value) || 35;
      if (!startWeight || !startDate) return alert('Enter starting weight and date.');
      
      batches.unshift({
        id: Date.now(),
        cut,
        startWeight,
        startDate,
        targetDays,
        history: [{ date: startDate, weight: startWeight }]
      });
      save();
      closeModal('addModal');
      document.getElementById('startWeight').value = '';
    }

    function openWeigh(id) {
      document.getElementById('weighBatchId').value = id;
      openModal('weighModal');
    }

    function saveWeighIn() {
      const id = parseInt(document.getElementById('weighBatchId').value);
      const w = parseFloat(document.getElementById('currentWeight').value);
      if (!w) return;
      const batch = batches.find(b => b.id === id);
      if (batch) {
        batch.history.push({
          date: new Date().toISOString().split('T')[0],
          weight: w
        });
        save();
      }
      closeModal('weighModal');
      document.getElementById('currentWeight').value = '';
    }

    function deleteBatch(id) {
      if (confirm('Delete this batch?')) {
        batches = batches.filter(b => b.id !== id);
        save();
      }
    }

    function render() {
      const container = document.getElementById('batchContainer');
      const empty = document.getElementById('emptyView');
      container.innerHTML = '';
      if (!batches.length) { container.appendChild(empty); return; }

      batches.forEach(b => {
        const start = new Date(b.startDate);
        const today = new Date();
        const diffDays = Math.max(0, Math.floor((today - start) / (1000 * 60 * 60 * 24)));
        const latestWeight = b.history[b.history.length - 1].weight;
        const lossGrams = b.startWeight - latestWeight;
        const lossPercent = ((lossGrams / b.startWeight) * 100).toFixed(1);

        let stageTitle = "";
        let stageNote = "";

        if (diffDays <= 7) {
          stageTitle = "STAGE 1: PELLICLE FORMING (Days 1–7)";
          stageNote = "Surface drying rapidly into dark mahogany rind[cite: 3]. High humidity is normal. Do NOT open the door often.";
        } else if (diffDays <= 28) {
          stageTitle = "STAGE 2: TENDERISATION (Days 8–28)";
          stageNote = "Natural enzymes are breaking down connective tissue[cite: 3]. Look for faint nutty/buttery popcorn aromas forming[cite: 3].";
        } else if (diffDays <= 45) {
          stageTitle = "STAGE 3: PRIME SWEET SPOT (Days 29–45)";
          stageNote = "Peak hazelnut and umami maturity[cite: 3]. Optimal window to harvest and trim[cite: 3]. Target loss: 15%–20%[cite: 3].";
        } else {
          stageTitle = "STAGE 4: DEEP FUNK (Days 45+)";
          stageNote = "Blue cheese & strong charcuterie notes[cite: 3]. High trim rind loss[cite: 3]. Harvest immediately when ready.";
        }

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:flex-start;">
            <div>
              <h2 style="margin:0; font-size:1.15rem; color:#fff;">${b.cut}</h2>
              <div style="font-size:0.8rem; color:var(--text-muted); margin-top:2px;">Day ${diffDays} of ${b.targetDays} • Started ${b.startDate}</div>
            </div>
            <button onclick="deleteBatch(${b.id})" style="background:none; border:none; color:#666; font-size:1.2rem; cursor:pointer;">✕</button>
          </div>

          <div class="stat-row">
            <div class="stat-item">
              <div class="stat-lbl">Days In</div>
              <div class="stat-num">${diffDays}</div>
            </div>
            <div class="stat-item">
              <div class="stat-lbl">Moisture Loss</div>
              <div class="stat-num" style="color:var(--accent);">-${lossPercent}%</div>
            </div>
            <div class="stat-item">
              <div class="stat-lbl">Current Wt</div>
              <div class="stat-num">${latestWeight}g</div>
            </div>
          </div>

          <div class="stage-box">
            <strong style="color:#d29922; display:block; margin-bottom:4px;">${stageTitle}</strong>
            ${stageNote}
          </div>

          <div style="background:#111418; padding:8px 10px; border-radius:6px; font-size:0.8rem; color:#8b949e; margin-bottom:10px;">
            <div>💡 <strong>Target Chamber:</strong> 1.5°C | 75%–80% RH | Salt Dry[cite: 3]</div>
          </div>

          <button class="btn btn-weigh" onclick="openWeigh(${b.id})">⚖️ Log Weigh-In</button>
        `;
        container.appendChild(card);
      });
    }

    render();
  </script>
</body>
</html>
