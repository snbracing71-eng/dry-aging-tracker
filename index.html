<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AgerLog - Tactical Pro-Gauge</title>

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root{--bg:#05070a;--card:#0c1017;--in:#070a0f;--bdr:#1e293b;--txt:#f8fafc;--mut:#94a3b8;--cy:#06b6d4;--cyg:#22d3ee;--am:#f59e0b;--amg:#fbbf24;--em:#10b981;--red:#ef4444}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:0 0 110px;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45}
header{background:#0c1017;border-bottom:2px solid var(--cy);box-shadow:0 2px 16px rgba(6,182,212,.2);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:40}
.brand{display:flex;align-items:center;gap:10px}
.logo-svg{width:42px;height:42px;border-radius:10px;box-shadow:0 0 12px rgba(6,182,212,.4)}
.b-title{font-size:1.3rem;font-weight:900;margin:0;color:#fff}.b-title span{color:var(--cyg)}
.h-right{display:flex;gap:8px}
.u-btn{background:#111827;border:1.5px solid var(--am);color:var(--amg);padding:7px 10px;border-radius:9px;font-size:.78rem;font-weight:900;cursor:pointer}
.g-btn{background:#111827;color:var(--cyg);border:1.5px solid var(--cy);padding:7px 11px;border-radius:9px;font-size:.8rem;font-weight:800;cursor:pointer}
main{padding:14px;max-width:600px;margin:0 auto}
.sec-t{font-size:.78rem;text-transform:uppercase;letter-spacing:1px;color:var(--cyg);margin:6px 0 10px 2px;font-weight:800}
.f-bar,.c-panel,.t-card,.h-card{background:var(--card);border:1.5px solid var(--bdr);border-radius:14px;padding:14px;margin-bottom:14px}
.f-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.f-lbl{font-size:.76rem;text-transform:uppercase;color:var(--amg);font-weight:800}
select,input,textarea{width:100%;background:#05070a;border:1.5px solid var(--bdr);border-radius:10px;padding:12px;color:#fff;font-size:1rem;font-weight:700}
.m-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.m-tile{background:var(--card);border:1.5px solid var(--bdr);border-radius:14px;padding:12px;display:flex;align-items:center;gap:10px;cursor:pointer}
.m-tile.active{border-color:var(--cyg);background:rgba(6,182,212,.14);box-shadow:0 0 14px rgba(6,182,212,.25)}
.m-ic{font-size:1.9rem}.m-nm{font-size:.98rem;font-weight:800;color:#fff;display:block}.m-sb{font-size:.75rem;color:var(--mut);display:block}
.c-head{font-size:.82rem;font-weight:800;color:var(--amg);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--bdr)}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.m-box{background:var(--in);border:1px solid var(--bdr);border-radius:10px;padding:9px 4px}
.m-lbl{font-size:.68rem;color:var(--mut);font-weight:700;text-transform:uppercase}
.m-val{font-size:1rem;font-weight:900;color:var(--cyg);margin-top:3px;font-family:monospace}
.r-box{margin-top:10px;font-size:.84rem;color:#e2e8f0;background:rgba(255,255,255,.03);padding:9px;border-radius:8px}
.c-top{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid var(--bdr);padding-bottom:10px;margin-bottom:12px}
.tag-b{display:inline-block;background:rgba(6,182,212,.15);color:var(--cyg);border:1px solid rgba(6,182,212,.4);padding:2px 8px;border-radius:6px;font-size:.73rem;font-weight:800;margin-bottom:4px}
.act-b{display:inline-block;background:rgba(245,158,11,.18);color:var(--amg);border:1px solid var(--am);padding:2px 8px;border-radius:6px;font-size:.73rem;font-weight:800;margin-left:6px}
.del-b{background:#111827;color:var(--red);border:1px solid #334155;width:34px;height:34px;border-radius:8px;cursor:pointer;font-weight:900}
.g-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.g-box{background:var(--in);border:1px solid var(--bdr);border-radius:12px;padding:10px 6px;text-align:center;position:relative}
.r-svg{width:104px;height:104px;transform:rotate(-90deg);display:block;margin:0 auto}
.r-bg{fill:none;stroke:#1e293b;stroke-width:9}
.r-cy{fill:none;stroke:var(--cyg);stroke-width:9;stroke-linecap:round}
.r-am{fill:none;stroke:var(--amg);stroke-width:9;stroke-linecap:round}
.r-ctr{position:absolute;top:41px;left:0;right:0;text-align:center}
.r-big{font-size:1.25rem;font-weight:900;color:#fff;line-height:1;display:block;font-family:monospace}
.r-sub{font-size:.66rem;color:var(--mut);font-weight:700;text-transform:uppercase;margin-top:2px;display:block}
.g-ft{font-size:.75rem;font-weight:800;color:#cbd5e1;margin-top:5px}
.w-strip{display:flex;justify-content:space-between;background:#090d14;border:1px solid var(--bdr);border-radius:10px;padding:9px 12px;margin-bottom:10px;text-align:center}
.w-val{font-size:1rem;font-weight:900;color:#fff;font-family:monospace}
.st-line{font-size:.83rem;font-weight:700;padding:7px 10px;border-radius:8px;background:rgba(255,255,255,.03);margin-bottom:8px}
.n-box{background:rgba(245,158,11,.12);border-left:3px solid var(--amg);padding:8px;border-radius:4px;font-size:.84rem;margin-bottom:8px}
.h-drop{background:var(--in);border:1px solid var(--bdr);border-radius:9px;padding:8px 10px;font-size:.82rem;color:var(--mut)}
.h-row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.05);font-family:monospace}
.btn{display:block;text-align:center;border:none;padding:13px;border-radius:11px;font-size:.96rem;font-weight:900;cursor:pointer;width:100%}
.b-cy{background:linear-gradient(135deg,#22d3ee,#06b6d4);color:#041014}
.b-am{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1a1002}
.b-red{background:var(--red);color:#fff}.b-sec{background:#1e293b;color:#fff}
.b-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.q-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.s-btn{background:#111827;border:1px solid var(--cy);color:var(--cyg);padding:9px 2px;border-radius:8px;font-weight:800;font-size:.82rem;cursor:pointer}
.bot-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(5,7,10,.96);padding:10px 14px 14px;max-width:600px;margin:0 auto;z-index:30;border-top:1px solid var(--bdr)}
.btn-new{background:linear-gradient(90deg,#06b6d4,#f59e0b);color:#05070a;border:none;border-radius:12px;padding:15px;width:100%;font-size:1.02rem;font-weight:900;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;padding:14px;z-index:100}
.modal.active{display:flex}
.m-cnt{background:var(--card);border:1.5px solid var(--cy);border-radius:16px;padding:18px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto}
.fg{margin-bottom:12px}.fg label{display:block;font-size:.85rem;color:#cbd5e1;margin-bottom:5px;font-weight:700}
.callout{background:rgba(6,182,212,.12);border:1px solid var(--cy);border-radius:9px;padding:10px;font-size:.85rem;color:#e0f2fe;margin:8px 0}
.s-box{background:var(--in);border:1px solid var(--bdr);border-radius:9px;padding:11px;margin-bottom:8px;font-size:.86rem}
.s-box strong{color:var(--amg);display:block;margin-bottom:3px}
</style>
</head>
