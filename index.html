  <style>
    :root {
      --bg: #05070a;
      --card: #0c1017;
      --card-inner: #070a0f;
      --border: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --cyan: #06b6d4;
      --cyan-glow: #22d3ee;
      --amber: #f59e0b;
      --amber-glow: #fbbf24;
      --emerald: #10b981;
      --red: #ef4444;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; padding: 0 0 115px 0;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 16px; line-height: 1.45;
    }

    /* Tactical Header */
    header {
      background: rgba(12, 16, 23, 0.96);
      border-bottom: 2px solid var(--cyan);
      box-shadow: 0 2px 18px rgba(6, 182, 212, 0.2);
      padding: 12px 16px;
      display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 40; backdrop-filter: blur(8px);
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-logo-svg {
      width: 44px; height: 44px; border-radius: 11px;
      box-shadow: 0 0 14px rgba(6, 182, 212, 0.4);
      flex-shrink: 0;
    }
    .brand-title {
      font-size: 1.35rem; font-weight: 900; letter-spacing: -0.5px; margin: 0; color: #fff;
    }
    .brand-title span { color: var(--cyan-glow); }

    .header-right { display: flex; align-items: center; gap: 8px; }
    .unit-toggle {
      background: #111827; border: 1.5px solid var(--amber); color: var(--amber-glow);
      padding: 8px 11px; border-radius: 9px; font-size: 0.8rem; font-weight: 900; cursor: pointer;
    }
    .guide-btn {
      background: #111827; color: var(--cyan-glow); border: 1.5px solid var(--cyan);
      padding: 8px 12px; border-radius: 9px; font-size: 0.82rem; font-weight: 800; cursor: pointer;
    }

    main { padding: 16px; max-width: 600px; margin: 0 auto; }
    .sec-title {
      font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px;
      color: var(--cyan-glow); margin: 6px 0 10px 2px; font-weight: 800;
    }

    /* Multi-Fridge Selector Bar */
    .fridge-bar {
      background: var(--card); border: 1.5px solid var(--border);
      border-radius: 14px; padding: 12px 14px; margin-bottom: 16px;
    }
    .fridge-header-row {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
    }
    .fridge-label {
      font-size: 0.78rem; text-transform: uppercase; color: var(--amber-glow); font-weight: 800; letter-spacing: 0.6px;
    }
    .fridge-select {
      background: #05070a; border: 1.5px solid #1e293b; border-radius: 9px;
      padding: 10px 12px; color: #fff; font-size: 1rem; font-weight: 700; width: 100%;
    }

    /* 4-Tile Category Grid */
    .mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .mode-tile {
      background: var(--card); border: 1.5px solid var(--border); border-radius: 14px;
      padding: 12px; display: flex; align-items: center; gap: 10px;
      cursor: pointer; transition: all 0.2s;
    }
    .mode-tile.active {
      border-color: var(--cyan-glow);
      background: rgba(6, 182, 212, 0.14);
      box-shadow: 0 0 16px rgba(6, 182, 212, 0.28);
    }
    .m-icon { font-size: 2rem; line-height: 1; pointer-events: none; }
    .m-name { font-size: 1rem; font-weight: 800; color: #fff; display: block; pointer-events: none; }
    .m-sub { font-size: 0.76rem; color: var(--muted); display: block; pointer-events: none; }

    /* Chamber Settings & Compatibility Panel */
    .chamber-panel {
      background: var(--card); border: 1.5px solid var(--border);
      border-radius: 14px; padding: 14px; margin-bottom: 18px;
    }
    .chamber-head {
      font-size: 0.82rem; font-weight: 800; color: var(--amber-glow);
      margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border);
    }
    .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
    .m-box {
      background: var(--card-inner); border: 1px solid #1e293b; border-radius: 10px; padding: 10px 4px;
    }
    .m-lbl { font-size: 0.7rem; color: var(--muted); font-weight: 700; text-transform: uppercase; }
    .m-val { font-size: 1.05rem; font-weight: 900; color: var(--cyan-glow); margin-top: 3px; font-family: monospace; }
    .rule-box {
      margin-top: 10px; font-size: 0.86rem; line-height: 1.45; color: #e2e8f0;
      background: rgba(255,255,255,0.03); padding: 10px; border-radius: 8px;
    }

    /* Tactical Batch Card with Dual Circular Gauges */
    .tactical-card {
      background: var(--card); border: 1.5px solid var(--border);
      border-radius: 16px; padding: 16px; margin-bottom: 16px;
      box-shadow: 0 8px 26px rgba(0,0,0,0.65);
    }
    .card-top {
      display: flex; justify-content: space-between; align-items: flex-start;
      border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 14px;
    }
    .tag-badge {
      display: inline-block; background: rgba(6, 182, 212, 0.15); color: var(--cyan-glow);
      border: 1px solid rgba(6, 182, 212, 0.4);
      padding: 2px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 800; margin-bottom: 5px;
    }
    .action-badge {
      display: inline-block; background: rgba(245, 158, 11, 0.18); color: var(--amber-glow);
      border: 1px solid var(--amber); padding: 2px 8px; border-radius: 6px;
      font-size: 0.74rem; font-weight: 800; margin-left: 6px; margin-bottom: 5px;
    }
    .cut-heading {
      margin: 0; font-size: 1.2rem; font-weight: 800; color: #fff; line-height: 1.25;
    }
    .cut-meta { font-size: 0.82rem; color: var(--muted); margin-top: 3px; }
    .del-batch-btn {
      background: #111827; color: var(--red); border: 1px solid #334155;
      width: 36px; height: 36px; border-radius: 8px; cursor: pointer;
      font-size: 1.1rem; font-weight: 900; display: flex; align-items: center; justify-content: center;
    }

    /* Dual Circular Ring Gauges */
    .gauges-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px;
    }
    .gauge-box {
      background: var(--card-inner); border: 1px solid #1e293b;
      border-radius: 14px; padding: 12px 8px; text-align: center; position: relative;
    }
    .ring-svg { width: 110px; height: 110px; transform: rotate(-90deg); display: block; margin: 0 auto; }
    .ring-bg { fill: none; stroke: #1e293b; stroke-width: 9; }
    .ring-cyan {
      fill: none; stroke: var(--cyan-glow); stroke-width: 9; stroke-linecap: round;
      filter: drop-shadow(0 0 6px rgba(34, 211, 238, 0.6));
      transition: stroke-dashoffset 0.4s ease;
    }
    .ring-amber {
      fill: none; stroke: var(--amber-glow); stroke-width: 9; stroke-linecap: round;
      filter: drop-shadow(0 0 6px rgba(251, 191, 36, 0.6));
      transition: stroke-dashoffset 0.4s ease;
    }
    .ring-center {
      position: absolute; top: 45px; left: 0; right: 0; text-align: center; pointer-events: none;
    }
    .ring-big { font-size: 1.35rem; font-weight: 900; color: #fff; line-height: 1; display: block; font-family: monospace; }
    .ring-sub { font-size: 0.68rem; color: var(--muted); font-weight: 700; text-transform: uppercase; margin-top: 3px; display: block; }
    .gauge-foot { font-size: 0.78rem; font-weight: 800; color: #cbd5e1; margin-top: 6px; }

    /* Live Weight Strip */
    .weight-strip {
      display: flex; justify-content: space-between; align-items: center;
      background: #090d14; border: 1px solid #1e293b; border-radius: 10px;
      padding: 10px 14px; margin-bottom: 12px;
    }
    .w-item { text-align: center; }
    .w-lbl { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; font-weight: 700; }
    .w-val { font-size: 1.05rem; font-weight: 900; color: #fff; font-family: monospace; }

    .status-line {
      font-size: 0.85rem; font-weight: 700; padding: 8px 10px;
      border-radius: 8px; background: rgba(255,255,255,0.03); margin-bottom: 10px;
    }
    .notes-box {
      background: rgba(245, 158, 11, 0.12); border-left: 3px solid var(--amber-glow);
      padding: 8px 10px; border-radius: 4px; font-size: 0.86rem; margin-bottom: 10px; color: #f3f4f6;
    }

    /* Weigh-In Journey Log inside Card */
    .history-dropdown {
      margin-top: 10px; background: var(--card-inner); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 12px; font-size: 0.84rem; color: var(--muted);
    }
    .history-row {
      display: flex; justify-content: space-between; padding: 5px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05); font-family: monospace;
    }
    .history-row:last-child { border-bottom: none; }

    /* Historical Summary Card */
    .history-card {
      background: var(--card); border: 1.5px solid var(--border);
      border-radius: 16px; padding: 16px 18px; margin-top: 8px; margin-bottom: 20px;
    }
    .history-card-head {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
    }
    .history-card-head h3 { margin: 0; font-size: 1.05rem; font-weight: 800; color: var(--cyan-glow); }
    .hist-entry { border-top: 1px solid var(--border); padding: 10px 0; }
    .hist-entry:last-child { padding-bottom: 0; }
    .hist-title { font-size: 0.92rem; font-weight: 700; color: #fff; }
    .hist-sub { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }

    /* Buttons */
    .btn {
      display: block; text-align: center; background: var(--cyan); color: #000;
      border: none; padding: 14px; border-radius: 12px;
      font-size: 1rem; font-weight: 900; cursor: pointer; width: 100%;
    }
    .btn-cyan { background: linear-gradient(135deg, #22d3ee, #06b6d4); color: #041014; }
    .btn-amber { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #1a1002; }
    .btn-sec { background: #1e293b; color: #fff; }
    .btn-red { background: var(--red); color: #fff; }
    .btn-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }

    /* Quick-Step Keypad Buttons */
    .quick-step-row {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px;
    }
    .step-btn {
      background: #111827; border: 1px solid var(--cyan); color: var(--cyan-glow);
      padding: 10px 4px; border-radius: 8px; font-weight: 800; font-size: 0.85rem; cursor: pointer;
    }

    /* Bottom Floating Action Bar */
    .bottom-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: linear-gradient(180deg, rgba(5,7,10,0) 0%, rgba(5,7,10,0.98) 30%);
      padding: 12px 16px 16px; max-width: 600px; margin: 0 auto; z-index: 30;
    }
    .btn-new-batch {
      background: linear-gradient(90deg, #06b6d4
